# The veritas CLI's tests on every OS people run it on. Windows is here because nobody on the team
# runs it there: this is the only check that keyring, the file store and `veritas claude` work.
name: veritas-cli tests

on:
  push:
    branches: [development, stage, main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e ".[test]"
      - run: python -m pytest -q
      - run: veritas --version
