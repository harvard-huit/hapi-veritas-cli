[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "veritas-cli"
version = "0.2.0"
description = "Get and use Apigee OAuth tokens (adex-oauth2-as) for HUIT AIS proxies"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "click>=8.1",
    "httpx>=0.27",
    "keyring>=24",
]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
veritas = "veritas.cli:run"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
